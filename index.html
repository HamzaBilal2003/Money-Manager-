<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Manager</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1B4332" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Money" />
<style>
  :root{
    --green-deep:#1B4332; --green:#2D6A4F; --green-mid:#40916C;
    --bg:#F4FAF6; --card:#ffffff; --border:#DCEAE2;
    --text:#14251C; --muted:#5B6B62; --muted2:#7A8A81;
    --red:#E63946; --orange:#E76F51;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI', system-ui, -apple-system, sans-serif;background:var(--bg);color:var(--text);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .fade{animation:fadeIn .25s ease;}
  /* Tablet and up: float the app as a card on a filled backdrop instead of edge-to-edge */
  @media (min-width:700px){
    body{background:linear-gradient(180deg,#EAF5EE,#F4FAF6);display:flex;justify-content:center;padding:32px 16px;min-height:100vh;}
    #app{max-width:560px;width:100%;min-height:auto;background:var(--bg);border-radius:24px;box-shadow:0 20px 60px rgba(27,67,50,0.12);overflow:hidden;margin:0;}
    .header,.setup-hero{border-radius:0;}
  }
  /* Desktop: a bit more breathing room, two-column category grid */
  @media (min-width:1000px){
    #app{max-width:640px;}
    .type-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .type-card{cursor:pointer;}
  }
  /* Respect notches / home-indicator areas on phones */
  #app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  #app{padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;}
  button:active{transform:scale(0.97);}
  input{font-family:inherit;}
  .header{background:linear-gradient(135deg,var(--green-deep),var(--green));padding:calc(20px + env(safe-area-inset-top)) 16px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 18px 18px;}
  .header-title{font-size:20px;font-weight:700;color:#fff;}
  .header-sub{font-size:12px;color:#DFF3E7;}
  .icon-btn-light{width:32px;height:32px;border-radius:9px;border:none;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;}
  .setup-hero{background:linear-gradient(135deg,var(--green-deep),var(--green));padding:calc(32px + env(safe-area-inset-top)) 20px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:0 0 18px 18px;}
  .section{padding:18px 16px 4px;}
  .label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:4px 0 6px;}
  .input{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14.5px;margin-bottom:14px;background:#fff;color:var(--text);outline:none;}
  .row-input{flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13.5px;background:#fff;color:var(--text);outline:none;}
  .type-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .type-row .color-dot{flex-shrink:0;}
  .type-row .row-input[type="number"]{flex:0 1 64px;}
  .color-dot{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;}
  .add-row-btn{display:flex;align-items:center;gap:6px;justify-content:center;width:100%;padding:10px;border-radius:10px;border:1.5px dashed #B7CFC1;background:transparent;color:var(--green);font-weight:600;font-size:13.5px;margin-top:4px;margin-bottom:8px;}
  .primary-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:14.5px;margin-top:6px;}
  .primary-btn:disabled{opacity:.5;cursor:default;}
  .secondary-btn{padding:13px;border-radius:12px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-weight:600;font-size:14.5px;}
  .summary-card{margin:14px 16px 0;background:var(--card);border-radius:16px;padding:16px 14px;box-shadow:0 4px 16px rgba(27,67,50,0.07);}
  .summary-row{display:flex;align-items:center;}
  .summary-stat{flex:1;text-align:center;}
  .summary-stat .lbl{font-size:11.5px;color:var(--muted2);margin-bottom:3px;}
  .summary-stat .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .divider{width:1px;background:#EAF2ED;align-self:stretch;margin:0 6px;}
  .progress-track{height:7px;background:#EAF2ED;border-radius:6px;margin-top:14px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;transition:width .3s ease;}
  .progress-track-sm{height:5px;background:#EEF3F0;border-radius:4px;margin-top:8px;overflow:hidden;}
  .progress-fill-sm{height:100%;border-radius:4px;transition:width .3s ease;}
  .cats-header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center;}
  .cats-title{font-weight:700;color:var(--text);font-size:15px;}
  .small-ghost-btn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--green);font-weight:600;font-size:12.5px;}
  .type-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
  .type-card{display:flex;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(27,67,50,0.05);cursor:pointer;}
  .type-stripe{width:6px;}
  .type-body{flex:1;padding:12px 12px 12px 14px;}
  .type-top{display:flex;justify-content:space-between;align-items:center;}
  .type-name{font-weight:600;color:var(--text);font-size:14.5px;}
  .type-actions{display:flex;align-items:center;gap:6px;}
  .icon-btn-sm{width:26px;height:26px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;}
  .type-nums{display:flex;justify-content:space-between;margin-top:6px;font-size:12.5px;}
  .empty-box{padding:22px 14px;text-align:center;color:#8FA095;font-size:13px;background:#fff;border-radius:12px;border:1.5px dashed var(--border);}
  .end-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--orange);background:#fff;color:var(--orange);font-weight:700;font-size:14px;}
  .danger-ghost-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:10px;border:none;background:transparent;color:#C1483A;font-weight:600;font-size:13px;}
  .expense-row{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:11px 12px;border-radius:12px;box-shadow:0 2px 8px rgba(27,67,50,0.04);}
  .icon-btn-ghost{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;}
  .history-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(27,67,50,0.05);}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:100px;}
  .mini-stats{display:flex;gap:14px;margin-top:10px;}
  .mini-stat .lbl{font-size:10.5px;color:var(--muted2);}
  .mini-stat .val{font-size:13.5px;font-weight:700;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,37,28,0.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
  .modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
  @media (min-width:700px){
    .modal-overlay{align-items:center;padding:20px;}
    .modal-sheet{border-radius:20px;max-width:420px;padding:22px 22px 26px;}
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
  .modal-title{font-weight:700;font-size:16px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .color-picker{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px;}
  .swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
  .swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px #fff inset;}
  .custom-color-wrap{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--border);cursor:pointer;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:100px;font-size:13px;z-index:100;}
  .loading-wrap{display:flex;align-items:center;justify-content:center;height:60vh;}
  .spinner{width:28px;height:28px;border:3px solid #DCEAE2;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const COLORS = ["#2D6A4F","#40916C","#52B788","#74C69D","#1B4332","#3A86FF","#F4A261","#E76F51","#9D4EDD","#E63946","#0077B6","#B08968"];
const BUDGET_KEY = "money-manager:budget";
const HISTORY_KEY = "money-manager:history";

let S = {
  loading: true,
  budget: null,
  history: [],
  view: "dashboard",
  activeTypeId: null,
  modal: null,       // { type: 'addExpense'|'addType'|'editType'|'confirmEnd'|'confirmDeleteType', ...payload }
  setupRows: [],
  toastTimer: null,
};

/* ---------- utils ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function money(n){
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function monthLabelNow(){
  return new Date().toLocaleDateString(undefined, {month:"long", year:"numeric"});
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- URL view routing (so refresh doesn't reset to home) ---------- */
function readViewFromURL(){
  const p = new URLSearchParams(window.location.search);
  return { view: p.get("view"), type: p.get("type") };
}
function writeViewToURL(view, typeId){
  const p = new URLSearchParams();
  if (view) p.set("view", view);
  if (typeId) p.set("type", typeId);
  const qs = p.toString();
  const newUrl = window.location.pathname + (qs ? "?" + qs : "");
  history.replaceState(null, "", newUrl);
}
function goto(view, typeId){
  S.view = view;
  S.activeTypeId = typeId || null;
  writeViewToURL(view, typeId);
  render();
}

/* ---------- persistence (window.storage — survives refresh) ---------- */
async function loadState(){
  try {
    const b = await window.storage.get(BUDGET_KEY, false);
    if (b && b.value) S.budget = JSON.parse(b.value);
  } catch(e) {}
  try {
    const h = await window.storage.get(HISTORY_KEY, false);
    if (h && h.value) S.history = JSON.parse(h.value);
  } catch(e) {}

  const fromUrl = readViewFromURL();
  if (S.budget && fromUrl.view) {
    S.view = fromUrl.view;
    S.activeTypeId = fromUrl.type || null;
  } else if (!S.budget) {
    S.view = "setup";
  } else {
    S.view = "dashboard";
  }
  S.loading = false;
  render();
}
async function saveBudget(){
  try {
    if (S.budget) await window.storage.set(BUDGET_KEY, JSON.stringify(S.budget), false);
    else await window.storage.delete(BUDGET_KEY, false).catch(()=>{});
  } catch(e) {}
}
async function saveHistory(){
  try { await window.storage.set(HISTORY_KEY, JSON.stringify(S.history), false); } catch(e) {}
}

/* ---------- toast ---------- */
function showToast(msg){
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast fade";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => { el.style.display = "none"; }, 1800);
}

/* ---------- mutations ---------- */
function createBudget(name, rows){
  S.budget = {
    id: uid(),
    name,
    startDate: new Date().toISOString(),
    types: rows.map(r => ({ id: uid(), name: r.name, color: r.color, allocated: Number(r.allocated)||0, spent: 0, expenses: [] })),
  };
  saveBudget();
  goto("dashboard");
  showToast("Budget started");
}
function addType(t){
  S.budget.types.push({ id: uid(), name: t.name, color: t.color, allocated: Number(t.allocated)||0, spent: 0, expenses: [] });
  saveBudget();
  render();
}
function deleteType(id){
  S.budget.types = S.budget.types.filter(t => t.id !== id);
  saveBudget();
  goto("dashboard");
}
function addExpense(typeId, amount, note){
  const amt = Number(amount);
  if (!amt || amt <= 0) return;
  const t = S.budget.types.find(t => t.id === typeId);
  t.spent += amt;
  t.expenses.unshift({ id: uid(), amount: amt, note: note||"", date: new Date().toISOString() });
  saveBudget();
  render();
  showToast("Expense added");
}
function deleteExpense(typeId, expenseId){
  const t = S.budget.types.find(t => t.id === typeId);
  const exp = t.expenses.find(e => e.id === expenseId);
  if (exp) t.spent -= exp.amount;
  t.expenses = t.expenses.filter(e => e.id !== expenseId);
  saveBudget();
  render();
}
function updateType(typeId, patch){
  const t = S.budget.types.find(t => t.id === typeId);
  Object.assign(t, patch);
  saveBudget();
  render();
}
function endBudget(){
  const totalAllocated = S.budget.types.reduce((s,t)=>s+t.allocated,0);
  const totalSpent = S.budget.types.reduce((s,t)=>s+t.spent,0);
  S.history.unshift({
    id: S.budget.id, name: S.budget.name, startDate: S.budget.startDate,
    closedDate: new Date().toISOString(),
    allocated: totalAllocated, spent: totalSpent, remaining: totalAllocated - totalSpent,
    types: S.budget.types.map(t => ({name:t.name, color:t.color, allocated:t.allocated, spent:t.spent})),
  });
  S.budget = null;
  saveBudget();
  saveHistory();
  goto("setup");
  showToast("Month closed");
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById("app");
  if (S.loading){
    app.innerHTML = `<div class="loading-wrap"><div class="spinner"></div></div>`;
    return;
  }
  let html = "";
  if (!S.budget) html = renderSetup();
  else if (S.view === "type") html = renderType();
  else if (S.view === "history") html = renderHistory();
  else html = renderDashboard();

  html += renderModal();
  app.innerHTML = `<div class="fade">${html}</div>`;
  wireEvents();
}

function renderSetup(){
  const previous = S.history[0];
  if (S.setupRows.length === 0 && !S._setupInit){
    S._setupInit = true;
    S.setupName = monthLabelNow();
    S.setupRows = (previous && previous.types && previous.types.length)
      ? previous.types.map(t => ({name:t.name, allocated:String(t.allocated), color:t.color}))
      : [
          {name:"Petrol", allocated:"", color:COLORS[6]},
          {name:"Outside Food", allocated:"", color:COLORS[7]},
          {name:"House Expense", allocated:"", color:COLORS[0]},
        ];
  }
  const total = S.setupRows.reduce((s,t)=>s+(Number(t.allocated)||0),0);
  const canStart = S.setupName.trim() && S.setupRows.some(t => t.name.trim() && Number(t.allocated) > 0);

  return `
  <div class="setup-hero">
    <div style="font-size:30px;">💵</div>
    <div style="font-size:20px;font-weight:700;color:#fff;margin-top:8px;">${previous ? "Start a new month" : "Set up your budget"}</div>
    <div style="font-size:13px;color:#DFF3E7;margin-top:4px;">${previous ? "Amounts carried over from last month — adjust as needed." : "Split your money into categories you can track."}</div>
  </div>
  <div class="section">
    <label class="label">Budget name</label>
    <input class="input" id="setup-name" value="${esc(S.setupName)}" placeholder="e.g. September 2026" oninput="S.setupName=this.value" />
  </div>
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <label class="label" style="margin:0;">Categories</label>
      <span style="font-size:12px;color:var(--muted);">Total: $${money(total)}</span>
    </div>
    ${S.setupRows.map((t,i) => `
      <div class="type-row">
        <button class="color-dot" style="background:${t.color}" data-action="cycleSetupColor" data-idx="${i}"></button>
        <input class="row-input" placeholder="Category name" value="${esc(t.name)}" oninput="S.setupRows[${i}].name=this.value" />
        <input class="row-input" style="text-align:right;" placeholder="0" type="number" inputmode="decimal" value="${esc(t.allocated)}" oninput="S.setupRows[${i}].allocated=this.value" onchange="render()" />
        <button class="icon-btn-ghost" data-action="removeSetupRow" data-idx="${i}">✕</button>
      </div>
    `).join("")}
    <button class="add-row-btn" data-action="addSetupRow">+ Add category</button>
  </div>
  <div style="padding:0 16px 24px;">
    <button class="primary-btn" data-action="startBudget" ${canStart ? "" : "disabled"}>✓ Start budget</button>
  </div>`;
}

function renderDashboard(){
  const b = S.budget;
  const totalAllocated = b.types.reduce((s,t)=>s+t.allocated,0);
  const totalSpent = b.types.reduce((s,t)=>s+t.spent,0);
  const remaining = totalAllocated - totalSpent;
  const pct = totalAllocated > 0 ? Math.min(100,(totalSpent/totalAllocated)*100) : 0;

  return `
  <div class="header">
    <div>
      <div class="header-sub">Current budget</div>
      <div class="header-title">${esc(b.name)}</div>
    </div>
    <button class="icon-btn-light" data-action="goHistory">📈</button>
  </div>
  <div class="summary-card">
    <div class="summary-row">
      <div class="summary-stat"><div class="lbl">Total</div><div class="val">$${money(totalAllocated)}</div></div>
      <div class="divider"></div>
      <div class="summary-stat"><div class="lbl">Spent</div><div class="val" style="color:var(--orange)">$${money(totalSpent)}</div></div>
      <div class="divider"></div>
      <div class="summary-stat"><div class="lbl">Remaining</div><div class="val" style="color:${remaining<0?"var(--red)":"var(--green)"}">$${money(remaining)}</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${remaining<0?"var(--red)":"var(--green)"}"></div></div>
  </div>
  <div class="cats-header">
    <div class="cats-title">Categories</div>
    <button class="small-ghost-btn" data-action="openAddType">+ Add</button>
  </div>
  <div class="type-list">
    ${b.types.length===0 ? `<div class="empty-box">No categories yet. Add one to start tracking.</div>` : ""}
    ${b.types.map(t => {
      const tPct = t.allocated>0 ? Math.min(100,(t.spent/t.allocated)*100) : 0;
      const over = t.spent > t.allocated;
      return `
      <div class="type-card" data-action="openType" data-id="${t.id}">
        <div class="type-stripe" style="background:${t.color}"></div>
        <div class="type-body">
          <div class="type-top">
            <div class="type-name">${esc(t.name)}</div>
            <div class="type-actions">
              <button class="icon-btn-sm" style="background:${t.color}1A" data-action="quickAddExpense" data-id="${t.id}" data-stop="1">+</button>
              <span style="color:#B7C4BC;">›</span>
            </div>
          </div>
          <div class="type-nums">
            <span style="color:${over?"var(--red)":"var(--muted)"}">$${money(t.spent)} of $${money(t.allocated)}</span>
            <span style="font-weight:600;color:${over?"var(--red)":"var(--green)"}">$${money(t.allocated-t.spent)} left</span>
          </div>
          <div class="progress-track-sm"><div class="progress-fill-sm" style="width:${tPct}%;background:${over?"var(--red)":t.color}"></div></div>
        </div>
      </div>`;
    }).join("")}
  </div>
  <div style="padding:16px;">
    <button class="end-btn" data-action="confirmEndBudget">🏁 End month &amp; start new</button>
  </div>`;
}

function renderType(){
  const t = S.budget.types.find(t => t.id === S.activeTypeId);
  if (!t) { goto("dashboard"); return ""; }
  const remaining = t.allocated - t.spent;
  const pct = t.allocated>0 ? Math.min(100,(t.spent/t.allocated)*100) : 0;
  const over = t.spent > t.allocated;

  return `
  <div class="header" style="background:${t.color}">
    <button class="icon-btn-light" data-action="goDashboard">←</button>
    <div class="header-title">${esc(t.name)}</div>
    <button class="icon-btn-light" data-action="openEditType" data-id="${t.id}">🎨</button>
  </div>
  <div class="summary-card">
    <div class="summary-row">
      <div class="summary-stat"><div class="lbl">Allocated</div><div class="val">$${money(t.allocated)}</div></div>
      <div class="divider"></div>
      <div class="summary-stat"><div class="lbl">Spent</div><div class="val" style="color:var(--orange)">$${money(t.spent)}</div></div>
      <div class="divider"></div>
      <div class="summary-stat"><div class="lbl">Remaining</div><div class="val" style="color:${remaining<0?"var(--red)":t.color}">$${money(remaining)}</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${over?"var(--red)":t.color}"></div></div>
  </div>
  <div style="padding:16px 16px 8px;">
    <button class="primary-btn" style="background:${t.color}" data-action="openAddExpense" data-id="${t.id}">+ Add expense</button>
  </div>
  <div style="padding:8px 16px;font-weight:700;font-size:14.5px;">Expense history</div>
  <div style="padding:0 16px 24px;display:flex;flex-direction:column;gap:8px;">
    ${t.expenses.length===0 ? `<div class="empty-box">No expenses logged yet.</div>` : ""}
    ${t.expenses.map(e => `
      <div class="expense-row">
        <div>
          <div style="font-weight:600;font-size:14px;">$${money(e.amount)}</div>
          <div style="font-size:12px;color:var(--muted2);">${e.note ? esc(e.note)+" · " : ""}${new Date(e.date).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div>
        </div>
        <button class="icon-btn-ghost" data-action="deleteExpense" data-id="${t.id}" data-exp="${e.id}">🗑</button>
      </div>`).join("")}
  </div>
  <div style="padding:0 16px 24px;">
    <button class="danger-ghost-btn" data-action="confirmDeleteType" data-id="${t.id}">🗑 Delete category</button>
  </div>`;
}

function renderHistory(){
  const totalSaved = S.history.reduce((s,h)=>s+h.remaining,0);
  return `
  <div class="header">
    <button class="icon-btn-light" data-action="goDashboard">←</button>
    <div class="header-title">Savings history</div>
    <div style="width:32px;"></div>
  </div>
  <div class="summary-card" style="text-align:center;">
    <div style="font-size:12px;color:var(--muted2);">Total carried across closed months</div>
    <div style="font-size:24px;font-weight:700;color:${totalSaved<0?"var(--red)":"var(--green)"};margin-top:4px;">$${money(totalSaved)}</div>
  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:10px;">
    ${S.history.length===0 ? `<div class="empty-box">No closed budgets yet. End a month to see it here.</div>` : ""}
    ${S.history.map(h => `
      <div class="history-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:700;font-size:15px;">${esc(h.name)}</div>
          <div style="font-size:11.5px;color:var(--muted2);">Closed ${new Date(h.closedDate).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</div>
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><div class="lbl">Total</div><div class="val">$${money(h.allocated)}</div></div>
          <div class="mini-stat"><div class="lbl">Spent</div><div class="val" style="color:var(--orange)">$${money(h.spent)}</div></div>
          <div class="mini-stat"><div class="lbl">Left</div><div class="val" style="color:${h.remaining<0?"var(--red)":"var(--green)"}">$${money(h.remaining)}</div></div>
        </div>
        <div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;">
          ${h.types.map(t => `<span class="tag" style="background:${t.color}1A;color:${t.color}">${esc(t.name)}</span>`).join("")}
        </div>
      </div>`).join("")}
  </div>`;
}

/* ---------- modal ---------- */
function renderModal(){
  if (!S.modal) return "";
  const m = S.modal;

  if (m.type === "addExpense" || m.type === "quickAddExpense"){
    const t = S.budget.types.find(t=>t.id===m.typeId);
    return `
    <div class="modal-overlay" data-action="closeModal">
      <div class="modal-sheet fade" data-stop="1">
        <div class="modal-header"><div class="modal-title">Add expense · ${esc(t.name)}</div><button class="icon-btn-ghost" data-action="closeModal">✕</button></div>
        <label class="label">Amount</label>
        <input class="input" id="exp-amount" type="number" inputmode="decimal" placeholder="0.00" autofocus />
        <label class="label">Note (optional)</label>
        <input class="input" id="exp-note" placeholder="e.g. Petrol pump refill" />
        <button class="primary-btn" style="background:${t.color}" data-action="submitAddExpense" data-id="${t.id}">✓ Add</button>
      </div>
    </div>`;
  }

  if (m.type === "addType"){
    if (!S._newTypeColor) S._newTypeColor = COLORS[0];
    return `
    <div class="modal-overlay" data-action="closeModal">
      <div class="modal-sheet fade" data-stop="1">
        <div class="modal-header"><div class="modal-title">New category</div><button class="icon-btn-ghost" data-action="closeModal">✕</button></div>
        <label class="label">Name</label>
        <input class="input" id="type-name" placeholder="e.g. Fast Food" autofocus />
        <label class="label">Allocated amount</label>
        <input class="input" id="type-allocated" type="number" inputmode="decimal" placeholder="0.00" />
        <label class="label">Card color</label>
        <div class="color-picker">
          ${COLORS.map(c => `<button class="swatch ${c===S._newTypeColor?"selected":""}" style="background:${c}" data-action="pickNewTypeColor" data-color="${c}"></button>`).join("")}
          <label class="custom-color-wrap" style="background:${S._newTypeColor}">
            <input type="color" value="${S._newTypeColor}" oninput="S._newTypeColor=this.value;render();" style="opacity:0;width:30px;height:30px;" />
          </label>
        </div>
        <button class="primary-btn" data-action="submitAddType">✓ Add category</button>
      </div>
    </div>`;
  }

  if (m.type === "editType"){
    const t = S.budget.types.find(t=>t.id===m.typeId);
    if (!S._editColor) S._editColor = t.color;
    return `
    <div class="modal-overlay" data-action="closeModal">
      <div class="modal-sheet fade" data-stop="1">
        <div class="modal-header"><div class="modal-title">Edit category</div><button class="icon-btn-ghost" data-action="closeModal">✕</button></div>
        <label class="label">Name</label>
        <input class="input" id="edit-name" value="${esc(t.name)}" />
        <label class="label">Allocated amount</label>
        <input class="input" id="edit-allocated" type="number" inputmode="decimal" value="${t.allocated}" />
        <label class="label">Card color</label>
        <div class="color-picker">
          ${COLORS.map(c => `<button class="swatch ${c===S._editColor?"selected":""}" style="background:${c}" data-action="pickEditColor" data-color="${c}"></button>`).join("")}
          <label class="custom-color-wrap" style="background:${S._editColor}">
            <input type="color" value="${S._editColor}" oninput="S._editColor=this.value;render();" style="opacity:0;width:30px;height:30px;" />
          </label>
        </div>
        <button class="primary-btn" data-action="submitEditType" data-id="${t.id}">✓ Save changes</button>
      </div>
    </div>`;
  }

  if (m.type === "confirmEnd"){
    const b = S.budget;
    const totalAllocated = b.types.reduce((s,t)=>s+t.allocated,0);
    const totalSpent = b.types.reduce((s,t)=>s+t.spent,0);
    const remaining = totalAllocated - totalSpent;
    return `
    <div class="modal-overlay" data-action="closeModal">
      <div class="modal-sheet fade" data-stop="1">
        <div class="modal-title" style="margin-bottom:8px;">End this month?</div>
        <div style="font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:20px;">This will lock "${esc(b.name)}" into your history with a remaining of $${money(remaining)}, and let you start a fresh budget.</div>
        <div style="display:flex;gap:10px;">
          <button class="secondary-btn" style="flex:1;" data-action="closeModal">Cancel</button>
          <button class="primary-btn" style="flex:1;margin-top:0;" data-action="submitEndBudget">End &amp; start new</button>
        </div>
      </div>
    </div>`;
  }

  if (m.type === "confirmDeleteType"){
    const t = S.budget.types.find(t=>t.id===m.typeId);
    return `
    <div class="modal-overlay" data-action="closeModal">
      <div class="modal-sheet fade" data-stop="1">
        <div class="modal-title" style="margin-bottom:8px;">Delete "${esc(t.name)}"?</div>
        <div style="font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:20px;">This removes the category and its expense history from this budget.</div>
        <div style="display:flex;gap:10px;">
          <button class="secondary-btn" style="flex:1;" data-action="closeModal">Cancel</button>
          <button class="primary-btn" style="flex:1;margin-top:0;background:var(--red)" data-action="submitDeleteType" data-id="${t.id}">Delete</button>
        </div>
      </div>
    </div>`;
  }
  return "";
}

/* ---------- events (delegation) ---------- */
function wireEvents(){
  const app = document.getElementById("app");
  app.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    if (el.dataset.stop) e.stopPropagation();
    const action = el.dataset.action;
    const id = el.dataset.id;

    if (action === "goHistory") return goto("history");
    if (action === "goDashboard") { S.modal=null; return goto("dashboard"); }
    if (action === "openType") return goto("type", id);
    if (action === "quickAddExpense"){ e.stopPropagation(); S.modal={type:"quickAddExpense", typeId:id}; return render(); }
    if (action === "openAddExpense"){ S.modal={type:"addExpense", typeId:id}; return render(); }
    if (action === "openAddType"){ S._newTypeColor=null; S.modal={type:"addType"}; return render(); }
    if (action === "openEditType"){ S._editColor=null; S.modal={type:"editType", typeId:id}; return render(); }
    if (action === "confirmEndBudget"){ S.modal={type:"confirmEnd"}; return render(); }
    if (action === "confirmDeleteType"){ S.modal={type:"confirmDeleteType", typeId:id}; return render(); }
    if (action === "closeModal"){ S.modal=null; return render(); }
    if (action === "deleteExpense"){ deleteExpense(id, el.dataset.exp); return; }

    if (action === "addSetupRow"){ S.setupRows.push({name:"",allocated:"",color:COLORS[S.setupRows.length % COLORS.length]}); return render(); }
    if (action === "removeSetupRow"){ S.setupRows.splice(Number(el.dataset.idx),1); return render(); }
    if (action === "cycleSetupColor"){
      const i = Number(el.dataset.idx);
      const idx = COLORS.indexOf(S.setupRows[i].color);
      S.setupRows[i].color = COLORS[(idx+1) % COLORS.length];
      return render();
    }
    if (action === "startBudget"){
      const rows = S.setupRows.filter(r => r.name.trim() && Number(r.allocated) > 0);
      if (!S.setupName.trim() || rows.length === 0) return;
      const name = S.setupName.trim();
      S.setupRows = []; S._setupInit = false;
      return createBudget(name, rows);
    }

    if (action === "pickNewTypeColor"){ S._newTypeColor = el.dataset.color; return render(); }
    if (action === "submitAddType"){
      const name = document.getElementById("type-name").value.trim();
      const allocated = document.getElementById("type-allocated").value;
      if (!name || !(Number(allocated) > 0)) return;
      S.modal = null;
      addType({name, allocated, color: S._newTypeColor || COLORS[0]});
      return;
    }

    if (action === "pickEditColor"){ S._editColor = el.dataset.color; return render(); }
    if (action === "submitEditType"){
      const name = document.getElementById("edit-name").value.trim();
      const allocated = document.getElementById("edit-allocated").value;
      S.modal = null;
      updateType(id, {name: name || undefined, allocated: Number(allocated)||0, color: S._editColor});
      return;
    }

    if (action === "submitAddExpense"){
      const amount = document.getElementById("exp-amount").value;
      const note = document.getElementById("exp-note").value;
      S.modal = null;
      addExpense(id, amount, note);
      return;
    }

    if (action === "submitEndBudget"){ S.modal = null; endBudget(); return; }
    if (action === "submitDeleteType"){ S.modal = null; deleteType(id); return; }
  };
}

/* ---------- boot ---------- */
loadState();

/* ---------- PWA: register service worker (enables Android install) ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
